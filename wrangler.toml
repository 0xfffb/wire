name = "wire"
main = "src/cloudflare.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/users/*", "/oauth/*"]

[[d1_databases]]
binding = "DB"
database_name = "wire"
database_id = "6094e70a-bc64-47a0-89df-7bec80aba5ba"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "35194c405ed64439912f3eccafeb5beb"

[[queues.producers]]
binding = "QUEUE"
queue = "wire-jobs"

[[queues.consumers]]
queue = "wire-jobs"
max_batch_size = 10
max_retries = 3

# */31 刷新过期 token；0 8 * * * 为北京时间 16:00 同步仓位
# 本地：
# curl "http://localhost:8787/cdn-cgi/local/scheduled?cron=*/31+*+*+*+*"
# curl "http://localhost:8787/cdn-cgi/local/scheduled?cron=0+8+*+*+*"
[triggers]
crons = ["*/31 * * * *", "0 8 * * *"]
